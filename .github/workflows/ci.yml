name: CI Pipeline Innovatech

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio (git clone)
        uses: actions/checkout@v4

      - name: Instalar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validar compilacion del Backend (Maven)
        run: mvn clean compile

  infra-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform (offline)
        run: terraform init -backend=false

      - name: Validar Formato Terraform
        run: terraform fmt -check

      - name: Validar Sintaxis Terraform
        run: terraform validate
